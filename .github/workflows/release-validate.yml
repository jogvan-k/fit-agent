name: release

# Builds standalone binaries for manual download. This workflow never publishes
# FitAgent to a package manager; GitHub Releases are the distribution channel.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and populate
        required: true
        type: string
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: '', archive: tar.gz }
          - { goos: linux, goarch: arm64, ext: '', archive: tar.gz }
          - { goos: darwin, goarch: arm64, ext: '', archive: tar.gz }
          - { goos: windows, goarch: amd64, ext: .exe, archive: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Verify source
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...
      - name: Build downloadable archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          NAME="fit-agent_${TAG}_${GOOS}_${GOARCH}"
          mkdir -p dist/package
          go build -trimpath -ldflags "-s -w -X github.com/jogvan-k/fit-agent/internal/cli.Version=${TAG}" -o "dist/package/fit-agent${EXT}" ./cmd/fit-agent
          cp README.md LICENSE dist/package/
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist/package && zip -q "../${NAME}.zip" fit-agent.exe README.md LICENSE)
          else
            tar -C dist/package -czf "dist/${NAME}.tar.gz" fit-agent README.md LICENSE
          fi
          rm -rf dist/package
      - uses: actions/upload-artifact@v4
        with:
          name: fit-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: upload GitHub Release downloads
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fit-agent-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Create or update GitHub Release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FitAgent $TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
